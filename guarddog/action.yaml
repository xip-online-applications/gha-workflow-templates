name: "GuardDog"
description: "Run GuardDog security scans on your [ extension, github_action, go, npm, pypi ] packages."
author: "XIP Online Applications"

branding:
    icon: "shield"
    color: "red"

inputs:
    dir:
        description: "The directory which contains the [ package.json, requirements.txt ] file"
        default: "."
    git-crypt-key:
        description: "The base64 encoded git-crypt decryption key"
        required: false
    package-manager:
        description: "[ extension, github_action, go, npm, pypi ]"
        default: "npm"
    exclude-rules:
        description: "Comma or newline separated GuardDog rule IDs to exclude"
        required: false
        default: ""
    log-level:
        description: "GuardDog log level [debug, info, warning, error, critical]"
        required: false
        default: ""
    fail-on-issues:
        description: "Whether the action should fail when GuardDog finds issues"
        required: false
        default: "true"

runs:
    using: "composite"
    steps:
        - name: Git-crypt unlock
          if: ${{ inputs.git-crypt-key != '' }}
          uses: xip-online-applications/gha-workflow-templates/git-crypt-unlock@main
          with:
              git-crypt-key: ${{ inputs.git-crypt-key }}

        - name: Setup Guarddog
          shell: bash
          run: |
              pipx install guarddog

        - name: Run GuardDog scans
          shell: bash
          working-directory: ${{ inputs.dir }}
          env:
              INPUT_LOG_LEVEL: ${{ inputs.log-level }}
              INPUT_PACKAGE_MANAGER: ${{ inputs.package-manager }}
              INPUT_EXCLUDE_RULES: ${{ inputs.exclude-rules }}
              INPUT_FAIL_ON_ISSUES: ${{ inputs.fail-on-issues }}
          run: |
              GUARDDOG_CMD=(guarddog)
              if [ -n "$INPUT_LOG_LEVEL" ]; then
                  GUARDDOG_CMD+=(--log-level "$INPUT_LOG_LEVEL")
              fi

              SCAN_CMD=("${GUARDDOG_CMD[@]}" "$INPUT_PACKAGE_MANAGER" scan ./)

              if [ -n "$INPUT_EXCLUDE_RULES" ]; then
                  while IFS= read -r rule; do
                      rule="$(echo "$rule" | xargs)"
                      if [ -n "$rule" ]; then
                          SCAN_CMD+=(--exclude-rules "$rule")
                      fi
                  done < <(printf '%s\n' "$INPUT_EXCLUDE_RULES" | tr ',' '\n')
              fi

              "${SCAN_CMD[@]}" --output-format json > /tmp/guarddog-results.json
              jq -r '("Heuristic\t#"), (.results | to_entries[] | "\(.key)\t\(.value | length)")' /tmp/guarddog-results.json

              ISSUES=$(jq '.results | to_entries[] | .value | length' /tmp/guarddog-results.json | awk '{s+=$1} END {print s}')

              if [ "$ISSUES" -gt 0 ]; then
                  "${SCAN_CMD[@]}"

                  if [ "$INPUT_FAIL_ON_ISSUES" = "true" ]; then
                      exit 1
                  fi
              fi
